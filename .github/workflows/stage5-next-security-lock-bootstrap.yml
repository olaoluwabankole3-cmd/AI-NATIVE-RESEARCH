# One-time security lockfile update, no application secrets.
# Remove this workflow after the pinned Next.js lockfile is committed.
name: Stage 5 patched Next.js lockfile bootstrap
on:
  push:
    branches: [stage5/production-reliability-20261110]

permissions:
  contents: write

jobs:
  patch-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 5 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Refresh lockfile for patched framework only
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const pkg = require('./package.json');
          if (pkg.dependencies.next !== '16.4.6' || pkg.devDependencies['eslint-config-next'] !== '16.4.6') {
            throw new Error('Unexpected patched framework versions');
          }
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'JS'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          for (const group of ['dependencies','devDependencies']) {
            for (const [name, version] of Object.entries(pkg[group])) {
              if (lock.packages[''][group][name] !== version) {
                throw new Error('Mismatched lockfile version for ' + name);
              }
            }
          }
          for (const name of ['next','eslint-config-next']) {
            const exact = pkg.dependencies[name] || pkg.devDependencies[name];
            if (lock.packages['node_modules/' + name]?.version !== exact) {
              throw new Error('Lockfile did not resolve patched version: ' + name);
            }
          }
          console.log('Patched framework lockfile verifies correctly.');
          JS
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 5: regenerate lockfile for patched Next.js 16.4.6'
          git push origin HEAD:refs/heads/stage5/production-reliability-20261110
