# Temporary bootstrap — delete after the generated lockfile is committed.
# This workflow never uses application secrets, and runs only on this review branch.
name: Stage 5 dependency lock bootstrap
on:
  push:
    branches: [stage5/production-reliability-20261110]

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Generate and commit deterministic npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo "A lockfile already exists; no bootstrap change needed."
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of ['@supabase/ssr', '@supabase/supabase-js']) {
            const version = lock.packages['node_modules/' + name]?.version;
            if (!version || !/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version)) {
              throw new Error('No resolved exact version for ' + name);
            }
            pkg.dependencies[name] = version;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of Object.keys(pkg.dependencies || {})) {
            if (lock.packages[''].dependencies[name] !== pkg.dependencies[name]) {
              throw new Error('Lockfile root differs from pinned package dependency: ' + name);
            }
          }
          console.log('Pinned direct dependency versions and complete transitive lockfile are in sync.');
          JS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Stage 5: pin resolved Supabase versions and commit complete npm lockfile'
          git push origin HEAD:refs/heads/stage5/production-reliability-20261110
