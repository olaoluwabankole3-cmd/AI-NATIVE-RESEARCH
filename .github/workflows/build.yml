name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Auth redirect regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Build
        run: npm run build
        env:
          # CI-only placeholders let Next.js prerender auth screens without live credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key

      - name: HTTP smoke test built application
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          node tests/http-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
