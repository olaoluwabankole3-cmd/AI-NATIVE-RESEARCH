name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: converge-build-v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (pinned, read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js (pinned action)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Validate lockfile and exact dependency versions
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(pkg[group] || {})) {
              if (!/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version)) {
                throw new Error('Dependency must have an exact version: ' + name);
              }
              if (lock.packages[''][group][name] !== version) {
                throw new Error('Lockfile does not match package.json: ' + name);
              }
            }
          }
          JS

      - name: Unit and regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Reject critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Check health monitor syntax and lint new reliability modules
        run: |
          node --check scripts/monitor-production.mjs
          npx --no-install eslint app/api/health/route.ts app/api/ready/route.ts scripts/monitor-production.mjs tests/production-health.test.mjs

      - name: Build
        run: npm run build
        env:
          # Isolated test credentials; production credentials never enter CI.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
          NEXT_PUBLIC_CONVERGE_PREVIEW_MODE: ui-only

      - name: HTTP smoke test built application
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          node tests/http-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
          NEXT_PUBLIC_CONVERGE_PREVIEW_MODE: ui-only
